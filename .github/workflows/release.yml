name: Release
on:
  push:
    tags:
    - 'v*'
jobs:
  build:
    name: Build
    strategy:
      matrix:
        operating-system:
        - ubuntu-latest
        - macOS-latest
        - windows-latest
        go-version:
        - '1.25'
    runs-on: ${{ matrix.operating-system }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - name: Download dependencies
      run: |
        go mod download
    - name: Build Artifacts
      if: matrix.operating-system != 'windows-latest'
      run: |
        go build -ldflags="-s -w" -o gcb-visualizer
        zip gcb-visualizer-${{ matrix.operating-system }}.zip gcb-visualizer
        rm gcb-visualizer
    - name: Build Artifacts
      if: matrix.operating-system == 'windows-latest'
      run: |
        go build -ldflags="-s -w" -o gcb-visualizer.exe
        compress-archive -destinationpath gcb-visualizer-${{ matrix.operating-system }}.zip -path gcb-visualizer.exe -compressionlevel optimal
        rm gcb-visualizer.exe
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts
        path: gcb-visualizer-${{ matrix.operating-system }}.zip
  create-release:
    name: Upload
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v3
      with:
        name: artifacts
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        files: |
          gcb-visualizer-ubuntu-latest.zip
          gcb-visualizer-macOS-latest.zip
          gcb-visualizer-windows-latest.zip
        name: Release ${{ github.ref }}
        token: ${{ secrets.GITHUB_TOKEN }}
        working_directory: ./artifacts/